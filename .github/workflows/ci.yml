# PR과 push마다 lint · 타입 검사 · 단위 테스트 · e2e 테스트를 돌린다
name: CI

on:
  push:
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · 타입 검사 · 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 단위 테스트
        run: npx vitest run

  e2e:
    name: e2e 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright.config.ts의 projects와 같이 Chromium만 설치한다
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # CI 환경변수가 있으면 playwright.config.ts가 재시도 2회, 기존 서버 재사용 안 함, GitHub 리포터를 쓴다
      - name: e2e 테스트
        run: npm run test:e2e

      # 실패하면 재시도 때 남긴 trace를 내려받아 npx playwright show-trace로 볼 수 있게 올린다
      - name: 실패 기록 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
